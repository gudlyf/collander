<!doctype html>
<!-- Source for docs/images/social-preview.png (1280x640, GitHub social preview).
     Regenerate: open in a browser at exactly 1280x640 and take a screenshot -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collander social preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f7f4; --ink: #14213d; --ink-2: #46516a; --muted: #7c8597; --line: #d9dde4;
    --cobalt: #2457b0; --cobalt-soft: #e3ebf9; --mod: #23794a; --mod-soft: #e2f2e8;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: var(--cobalt);
    font-family: "Bricolage Grotesque", sans-serif;
    color: var(--ink);
    position: relative;
  }
  /* Speckled enamel texture */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.10) 1.6px, transparent 2px),
      radial-gradient(circle, rgba(10,25,60,.18) 1.4px, transparent 1.8px);
    background-size: 37px 31px, 53px 47px;
    background-position: 0 0, 19px 11px;
  }
  .wrap { position: relative; height: 100%; display: grid; grid-template-columns: 560px 1fr; align-items: center; padding: 0 72px; gap: 56px; }
  .left { color: #fff; }
  .mark { width: 132px; height: auto; display: block; margin-bottom: 26px; }
  h1 { font-size: 104px; font-weight: 800; letter-spacing: -0.035em; line-height: .92; }
  .tag { margin-top: 22px; font-size: 30px; line-height: 1.25; font-weight: 500; color: #dfe8fb; max-width: 470px; }
  .chips { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 8px; max-width: 480px; }
  .chip { font-size: 18px; font-weight: 700; padding: 6px 13px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; }

  /* Recipe card */
  .card {
    background: var(--paper); border-radius: 26px; padding: 30px 32px 26px;
    box-shadow: 0 24px 60px rgba(8, 20, 50, .35), 0 0 0 6px var(--ink);
    transform: rotate(-1.6deg);
  }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .card h2 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .scaler { display: inline-flex; background: var(--ink); border-radius: 999px; padding: 4px; gap: 2px; }
  .scaler span { font-weight: 700; font-size: 17px; color: var(--paper); padding: 6px 12px; border-radius: 999px; }
  .scaler .on { background: var(--paper); color: var(--ink); }
  ul { list-style: none; padding: 0; font-family: "Source Serif 4", serif; font-size: 23px; line-height: 1.35; }
  li { padding: 9px 0; border-bottom: 1.5px dashed var(--line); display: grid; grid-template-columns: 26px 1fr; gap: 10px; }
  li:last-child { border-bottom: 0; }
  .box { width: 18px; height: 18px; border: 2px solid var(--muted); border-radius: 4px; margin-top: 6px; }
  .q { background: var(--cobalt-soft); border-radius: 4px; padding: 0 3px; }
  .orig { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
  .yours { display: block; color: var(--mod); font-weight: 600; padding-left: 22px; position: relative; }
  .yours::before { content: ""; position: absolute; left: 4px; top: 2px; width: 11px; height: 13px; border-left: 2.5px solid var(--mod); border-bottom: 2.5px solid var(--mod); border-bottom-left-radius: 5px; }
  .why { display: block; font-family: "Bricolage Grotesque", sans-serif; font-size: 16px; color: var(--mod); padding-left: 22px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <svg class="mark" viewBox="30 150 452 280" aria-hidden="true">
        <rect x="186" y="384" width="140" height="34" rx="12" fill="#14213D"/>
        <path d="M92 212h328c0 112-70 184-164 184S92 324 92 212z" fill="#F6F7F4"/>
        <rect x="34" y="190" width="92" height="40" rx="20" fill="none" stroke="#14213D" stroke-width="18"/>
        <rect x="386" y="190" width="92" height="40" rx="20" fill="none" stroke="#14213D" stroke-width="18"/>
        <rect x="74" y="186" width="364" height="48" rx="24" fill="#14213D"/>
        <g fill="#2457B0">
          <circle cx="160" cy="270" r="14"/><circle cx="208" cy="270" r="14"/><circle cx="256" cy="270" r="14"/>
          <circle cx="304" cy="270" r="14"/><circle cx="352" cy="270" r="14"/>
          <circle cx="184" cy="314" r="13"/><circle cx="232" cy="314" r="13"/><circle cx="280" cy="314" r="13"/>
          <circle cx="328" cy="314" r="13"/>
          <circle cx="220" cy="354" r="11"/><circle cx="256" cy="354" r="11"/><circle cx="292" cy="354" r="11"/>
        </g>
      </svg>
      <h1>Collander</h1>
      <p class="tag">Your self-hosted recipe box. Keep the original, cook your version.</p>
      <div class="chips">
        <span class="chip">Links</span><span class="chip">Photos</span><span class="chip">Evernote</span>
        <span class="chip">Claude</span><span class="chip">OpenAI</span><span class="chip">Gemini</span><span class="chip">Ollama</span>
        <span class="chip">Docker</span>
      </div>
    </div>
    <div class="card">
      <div class="card-head">
        <h2>Tomato Soup</h2>
        <div class="scaler"><span>½×</span><span>1×</span><span class="on">2×</span><span>3×</span></div>
      </div>
      <ul>
        <li><span class="box"></span><span><span class="q">4</span> tbsp butter</span></li>
        <li><span class="box"></span><span><span class="q">4</span> (28 oz) cans whole tomatoes</span></li>
        <li><span class="box"></span><span><span class="orig">3 cups skim milk</span>
          <span class="yours"><span class="q">3</span> cups almond milk</span>
          <span class="why">dairy-free</span></span></li>
        <li><span class="box"></span><span><span class="q">4–6</span> tbsp basil, torn</span></li>
      </ul>
    </div>
  </div>
</body>
</html>
