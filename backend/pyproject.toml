[project]
name = "collander"
version = "1.0.0"
description = "Self-hosted recipe manager with AI import"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.6",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "lxml>=6.1.3",
    "openai>=3.50.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.33",
    "recipe-scrapers>=15.13.0",
    "resvg-py>=0.5.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
